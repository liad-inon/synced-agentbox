name: Build, test and publish image
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build fresh upstream image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          pull: true
          load: true
          platforms: linux/amd64
          tags: synced-agentbox:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=AgentBox with a shared base repository volume at /repo
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify shared repository behavior
        run: bash tests/shared-repo.sh synced-agentbox:test
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          COMMIT: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker tag synced-agentbox:test "$IMAGE:sha-$COMMIT"
          docker push "$IMAGE:sha-$COMMIT"
          if [ "$REF_TYPE" = tag ]; then
            docker tag synced-agentbox:test "$IMAGE:$REF_NAME"
            docker push "$IMAGE:$REF_NAME"
          else
            docker tag synced-agentbox:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
