services:
  dev:
    image: ghcr.io/liad-inon/synced-agentbox:latest
    pull_policy: always
    working_dir: /repo
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: ["sleep", "infinity"]
    volumes:
      - type: bind
        source: ${REPO_PATH:?Set REPO_PATH to an absolute repository directory}
        target: /repo
        read_only: false
        bind:
          create_host_path: false
